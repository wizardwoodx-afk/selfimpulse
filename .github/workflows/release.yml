name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  gate:
    name: three-bar gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm
      - run: npm ci
      - name: types
        run: npx tsc --noEmit
      - name: dev probes
        run: npm test
      - name: offline pack
        run: node verify/run.mjs
      - name: release notes
        # The upgrade doc name is pinned here on purpose: probe/versionDrift asserts this
        # workflow names the current release's notes, so a version bump without a matching
        # doc fails the gate instead of shipping a release with no upgrade path.
        run: |
          DOC="docs/releases/SI-19.7-UPGRADE.md"
          if [ ! -f "$DOC" ]; then
            echo "::error::release notes missing: $DOC"
            exit 1
          fi
          echo "Release notes: $DOC"

  # ── audit H2: this workflow used to STOP after verification — a green v1.0.0
  # tag produced NOTHING. Publication now exists, and it is honest about what it
  # is: a source archive + SHA256SUMS. No signing keys exist in this repo yet, so
  # binaries are NOT published unsigned-and-pretended; the checksums are the
  # integrity claim until a signing identity is provisioned.
  publish:
    name: publish archive + checksums
    runs-on: ubuntu-latest
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: source archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git archive --format=zip -o "SI-${VERSION}-source.zip" HEAD
          sha256sum "SI-${VERSION}-source.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SI-*-source.zip
            SHA256SUMS.txt
          generate_release_notes: true
