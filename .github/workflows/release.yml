name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  gate:
    name: full probe gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: release notes
        run: echo "See 11H-19.7-UPGRADE.md for this release's notes."
