<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SelfImpulse — an on-device AI captain that governs, executes, verifies and receipts every action. Built on the MJ engine." />
    <meta name="theme-color" content="#000000" />
    <title>SelfImpulse — Agentic impulse, for all.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D5B26B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 12l2 2 4-4'/%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3C/svg%3E" type="image/svg+xml" />
    <script>
      // Boot: surface errors early. No splash — the app paints directly.
      (function(){
        /* Resolve the theme before any stylesheet paints. vh.css carries its
         * colour tokens only under [data-theme=dark] / [data-theme=light], so
         * with no attribute set `color:var(--fg)` is invalid-at-computed-value
         * (black) while the inline background below forces the dark ground —
         * black text on a dark ground for the whole first frame. */
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("vh.theme.v2") === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        window.addEventListener('error', function(e){ console.error('[11h]', e.message); });
        window.addEventListener('unhandledrejection', function(e){ console.error('[11h]', e.reason); });
      })();
    </script>
    <!-- CRITICAL GROUND. This block is the only paint that happens before the
         stylesheet loads, and its selectors (html[data-theme=light] body)
         outrank vh.css's `body{...}`, so if the two disagree the app shows the
         wrong ground for as long as this rule wins — which, being inline, is
         forever. They drifted once already: this said #0D1010 / #FAEBD7 while
         the sheet said something else entirely. verify/suites/theme.test.mjs
         now asserts they match, so they cannot separate again.

         SI REDESIGN — these values are DELIBERATELY UNCHANGED, and that is the
         correct outcome rather than an oversight. The new design system
         (src/ui/si/si.css) grounds the chrome on --si-bg: #000000, which is
         already true black — the same value vh.css uses for --bg in the dark
         theme, and the same value this block has carried all along. So the
         ground is correct under BOTH stylesheets, and vh.css still styles the
         screen interiors (another stream owns it). Changing this block to a
         "new" colour would have introduced the exact drift the comment above
         warns about, for no visible gain. The light fallback likewise stays
         #F7F7F5 to match vh.css's light --bg. -->
    <style>html,body{margin:0;padding:0;background:#000000}html[data-theme="light"],html[data-theme="light"] body{background:#F7F7F5}#root{min-height:100vh}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
