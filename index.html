<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SelfImpulse — an on-device AI captain that governs, executes, verifies and receipts every action. Built on the MJ engine." />
    <meta name="theme-color" content="#000000" />
    <title>SelfImpulse — Agentic impulse, for all.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Cpath d='M4 36h12l8-24 10 40 8-28 5 12h13' fill='none' stroke='%23F6F6F7' stroke-width='3.5' stroke-linecap='square' stroke-linejoin='miter'/%3E%3Ccircle cx='56' cy='53' r='4' fill='%233CE8C9'/%3E%3C/svg%3E" type="image/svg+xml" />
    <script>
      // Boot: surface errors early. No splash — the app paints directly.
      (function(){
        /* Resolve the theme before any stylesheet paints. vh.css carries its
         * colour tokens only under [data-theme=dark] / [data-theme=light], so
         * with no attribute set `color:var(--fg)` is invalid-at-computed-value
         * (black) while the inline background below forces #0D1010 — black text
         * on charcoal for the whole first frame. */
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("vh.theme.v2") === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
        window.addEventListener('error', function(e){ console.error('[11h]', e.message); });
        window.addEventListener('unhandledrejection', function(e){ console.error('[11h]', e.reason); });
      })();
    </script>
    <style>html,body{margin:0;padding:0;background:#000000}html[data-theme="light"],html[data-theme="light"] body{background:#FAF7F1}#root{min-height:100vh}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
